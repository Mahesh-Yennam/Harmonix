<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c142c" />
      <stop offset="70%" stop-color="#050814" />
      <stop offset="100%" stop-color="#020308" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Core Glow -->
    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Disc Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Outer Neon Magenta Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#f72585" stroke-width="2.5" opacity="0.4" filter="url(#neonGlow)" />
  
  <!-- Middle Deep Violet Ring -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#7b2cbf" stroke-width="3" opacity="0.75" filter="url(#neonGlow)" />

  <!-- Inner Cyan Ring -->
  <circle cx="64" cy="64" r="25" fill="none" stroke="#00f5d4" stroke-width="3.5" opacity="0.95" filter="url(#neonGlow)" />

  <!-- Innermost Echo Ring -->
  <circle cx="64" cy="64" r="14" fill="none" stroke="#00f5d4" stroke-width="2" stroke-dasharray="2 3" opacity="0.8" />

  <!-- Center Core Orb Glow -->
  <circle cx="64" cy="64" r="8" fill="#f72585" filter="url(#coreGlow)" opacity="0.85" />
  <circle cx="64" cy="64" r="4.5" fill="#ffffff" />
</svg>
